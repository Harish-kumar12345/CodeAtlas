<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password — CodeAtlas</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237567f8'/%3E%3Cpath fill='white' d='M8 8h7v7H8zm9 0h7v7h-7zM8 17h7v7H8zm9 0h7v7h-7z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-card {
      max-width: 420px;
      margin: 4rem auto;
      padding: 2.25rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      animation: fadeDown 0.4s ease both;
    }
    .auth-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.4rem; }
    .auth-sub { color: var(--text2); font-size: 0.9rem; margin-bottom: 1.8rem; }
    .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text2); }
    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 0.75rem 0.9rem;
      font-size: 0.95rem;
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(117,103,248,0.2);
    }
    .auth-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      margin-top: 0.8rem;
      transition: background var(--transition-fast);
    }
    .auth-btn:hover { background: var(--accent2); }
    .auth-btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .alert-box {
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .alert-error { background: var(--hard-bg); border: 1px solid var(--danger); color: var(--danger); }
    .alert-success { background: var(--easy-bg); border: 1px solid var(--success); color: var(--success); }
    .auth-footer { text-align: center; margin-top: 1.6rem; font-size: 0.85rem; color: var(--text2); }
    .auth-footer a { color: var(--accent2); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page-wrapper">
    <header class="site-header">
      <a href="/" style="text-decoration: none;" class="logo-group">
        <div class="logo-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="11" height="11" rx="3" fill="#7c6aff"/>
            <rect x="15" y="2" width="11" height="11" rx="3" fill="#7c6aff" opacity=".5"/>
            <rect x="2" y="15" width="11" height="11" rx="3" fill="#7c6aff" opacity=".5"/>
            <rect x="15" y="15" width="11" height="11" rx="3" fill="#7c6aff" opacity=".25"/>
          </svg>
        </div>
        <span class="logo-text">CodeAtlas</span>
      </a>
      <div class="header-actions">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light theme">☼ Light</button>
        <a href="/login.html" class="header-link">← Back to sign in</a>
      </div>
    </header>

    <main>
      <div class="auth-card">
        <h1 class="auth-title">Forgot password</h1>
        <p class="auth-sub">Enter your email and we'll send you instructions to reset your password.</p>

        <div id="alert-msg" class="alert-box" role="alert"></div>

        <form id="forgot-form" novalidate>
          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
          </div>

          <button type="submit" id="submit-btn" class="auth-btn">
            Send reset instructions
          </button>
        </form>

        <div class="auth-footer">
          Remember your password? <a href="/login.html">Sign in</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    const themeToggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("codeatlas-theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      themeToggle.textContent = t === "light" ? "◐ Dark" : "☼ Light";
    }
    applyTheme(savedTheme);
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      localStorage.setItem("codeatlas-theme", next);
      applyTheme(next);
    });

    const alertBox = document.getElementById("alert-msg");
    function showAlert(text, type = "error") {
      alertBox.textContent = text;
      alertBox.className = `alert-box alert-${type}`;
      alertBox.style.display = "block";
    }

    let csrfToken = null;
    async function fetchCsrf() {
      try {
        const res = await fetch("/auth/csrf");
        const data = await res.json();
        csrfToken = data.csrfToken;
      } catch {}
    }
    fetchCsrf();

    const form = document.getElementById("forgot-form");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      const email = document.getElementById("email").value.trim();
      if (!email) return showAlert("Please enter your email address.");

      submitBtn.disabled = true;
      submitBtn.textContent = "Sending...";

      try {
        if (!csrfToken) await fetchCsrf();
        const res = await fetch("/auth/forgot-password", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": csrfToken || "",
          },
          body: JSON.stringify({ email }),
        });
        const data = await res.json();
        showAlert(data.message, "success");
        submitBtn.disabled = false;
        submitBtn.textContent = "Send reset instructions";
      } catch {
        showAlert("Failed to send reset email. Please try again.");
        submitBtn.disabled = false;
        submitBtn.textContent = "Send reset instructions";
      }
    });
  </script>
</body>
</html>
