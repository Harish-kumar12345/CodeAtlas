<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign up — CodeAtlas</title>
  <meta name="description" content="Create a CodeAtlas account to link your LeetCode, Codeforces, and CodeChef stats into one unified profile." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%237567f8'/%3E%3Cpath fill='white' d='M8 8h7v7H8zm9 0h7v7h-7zM8 17h7v7H8zm9 0h7v7h-7z'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <style>
    .auth-card {
      max-width: 440px;
      margin: 3rem auto;
      padding: 2.25rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      animation: fadeDown 0.4s ease both;
    }
    .auth-title { font-family: var(--font-display); font-size: 1.8rem; font-weight: 700; margin-bottom: 0.4rem; }
    .auth-sub { color: var(--text2); font-size: 0.9rem; margin-bottom: 1.8rem; }
    .form-group { margin-bottom: 1.2rem; display: flex; flex-direction: column; gap: 0.4rem; }
    .form-label { font-size: 0.8rem; font-weight: 600; color: var(--text2); }
    .form-input {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      border-radius: var(--radius-sm);
      color: var(--text);
      padding: 0.75rem 0.9rem;
      font-size: 0.95rem;
      transition: border-color var(--transition-fast), outline-color var(--transition-fast);
    }
    .form-input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(117,103,248,0.2);
    }
    .strength-meter {
      height: 4px;
      background: var(--surface3);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 0.35rem;
    }
    .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }
    .strength-text {
      font-size: 0.72rem;
      color: var(--text3);
      margin-top: 0.25rem;
      display: flex;
      justify-content: space-between;
    }
    .auth-btn {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius-sm);
      padding: 0.85rem;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      margin-top: 1rem;
      transition: background var(--transition-fast);
    }
    .auth-btn:hover { background: var(--accent2); }
    .auth-btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .oauth-divider {
      display: flex;
      align-items: center;
      gap: 0.8rem;
      margin: 1.6rem 0;
      color: var(--text3);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .oauth-divider::before, .oauth-divider::after { content: ""; flex: 1; height: 1px; background: var(--border); }
    .oauth-btns { display: flex; flex-direction: column; gap: 0.65rem; }
    .oauth-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.65rem;
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border2);
      color: var(--text);
      padding: 0.7rem;
      border-radius: var(--radius-sm);
      text-decoration: none;
      font-size: 0.88rem;
      font-weight: 600;
      transition: background var(--transition-fast), border-color var(--transition-fast);
    }
    .oauth-btn:hover { background: var(--surface3); border-color: var(--accent); }
    .alert-box {
      padding: 0.75rem 0.9rem;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      margin-bottom: 1.2rem;
      display: none;
    }
    .alert-error { background: var(--hard-bg); border: 1px solid var(--danger); color: var(--danger); }
    .alert-success { background: var(--easy-bg); border: 1px solid var(--success); color: var(--success); }
    .auth-footer { text-align: center; margin-top: 1.6rem; font-size: 0.85rem; color: var(--text2); }
    .auth-footer a { color: var(--accent2); text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page-wrapper">
    <header class="site-header">
      <a href="/" style="text-decoration: none;" class="logo-group">
        <div class="logo-icon" aria-hidden="true">
          <svg width="28" height="28" viewBox="0 0 28 28" fill="none">
            <rect x="2" y="2" width="11" height="11" rx="3" fill="#7c6aff"/>
            <rect x="15" y="2" width="11" height="11" rx="3" fill="#7c6aff" opacity=".5"/>
            <rect x="2" y="15" width="11" height="11" rx="3" fill="#7c6aff" opacity=".5"/>
            <rect x="15" y="15" width="11" height="11" rx="3" fill="#7c6aff" opacity=".25"/>
          </svg>
        </div>
        <span class="logo-text">CodeAtlas</span>
      </a>
      <div class="header-actions">
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Switch to light theme" aria-pressed="false">☼ Light</button>
        <a href="/" class="header-link">← Back to search</a>
      </div>
    </header>

    <main>
      <div class="auth-card">
        <h1 class="auth-title">Create account</h1>
        <p class="auth-sub">Start tracking your goals and unify all your platform stats.</p>

        <div id="alert-msg" class="alert-box" role="alert"></div>

        <form id="register-form" novalidate>
          <div class="form-group">
            <label for="displayName" class="form-label">Display name</label>
            <input type="text" id="displayName" name="displayName" class="form-input" placeholder="e.g. Alex Chen" autocomplete="name" maxlength="50" required />
          </div>

          <div class="form-group">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required />
          </div>

          <div class="form-group">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-input" placeholder="At least 8 characters" autocomplete="new-password" required />
            <div class="strength-meter">
              <div id="strength-bar" class="strength-bar"></div>
            </div>
            <div class="strength-text">
              <span id="strength-label">Password strength</span>
              <span>Min. 8 characters</span>
            </div>
          </div>

          <div class="form-group">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="••••••••" autocomplete="new-password" required />
          </div>

          <button type="submit" id="submit-btn" class="auth-btn">
            <span class="btn-text">Create account</span>
          </button>
        </form>

        <div class="oauth-divider">Or continue with</div>

        <div class="oauth-btns">
          <a href="/auth/google" class="oauth-btn">
            <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.5 1 3.7 3.6 1.9 7.3l3.7 2.9C6.5 7.4 9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.6 14.8c-.2-.7-.4-1.5-.4-2.3s.2-1.6.4-2.3L1.9 7.3C.7 9.7 0 12.3 0 15.2s.7 5.5 1.9 7.9l3.7-2.9z"/><path fill="#34A853" d="M12 24c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3 0-5.5-2-6.4-4.8L1.9 17.4C3.7 21.1 7.5 24 12 24z"/></svg>
            Continue with Google
          </a>
          <a href="/auth/github" class="oauth-btn">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
            Continue with GitHub
          </a>
        </div>

        <div class="auth-footer">
          Already have an account? <a href="/login.html">Sign in</a>
        </div>
      </div>
    </main>
  </div>

  <script>
    const themeToggle = document.getElementById("theme-toggle");
    const savedTheme = localStorage.getItem("codeatlas-theme") || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
    function applyTheme(t) {
      document.documentElement.dataset.theme = t;
      themeToggle.textContent = t === "light" ? "◐ Dark" : "☼ Light";
      themeToggle.setAttribute("aria-pressed", String(t === "light"));
    }
    applyTheme(savedTheme);
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "light" ? "dark" : "light";
      localStorage.setItem("codeatlas-theme", next);
      applyTheme(next);
    });

    const alertBox = document.getElementById("alert-msg");
    function showAlert(text, type = "error") {
      alertBox.textContent = text;
      alertBox.className = `alert-box alert-${type}`;
      alertBox.style.display = "block";
    }

    // Password strength calculation
    const passwordInput = document.getElementById("password");
    const strengthBar = document.getElementById("strength-bar");
    const strengthLabel = document.getElementById("strength-label");

    passwordInput.addEventListener("input", () => {
      const val = passwordInput.value;
      if (!val) {
        strengthBar.style.width = "0%";
        strengthLabel.textContent = "Password strength";
        return;
      }
      let score = 0;
      if (val.length >= 8) score += 25;
      if (val.length >= 12) score += 25;
      if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 25;
      if (/\d/.test(val) && /[^A-Za-z0-9]/.test(val)) score += 25;

      strengthBar.style.width = `${score}%`;
      if (score < 50) {
        strengthBar.style.background = "var(--danger)";
        strengthLabel.textContent = "Weak password";
      } else if (score < 75) {
        strengthBar.style.background = "var(--warning)";
        strengthLabel.textContent = "Fair password";
      } else {
        strengthBar.style.background = "var(--success)";
        strengthLabel.textContent = "Strong password";
      }
    });

    let csrfToken = null;
    async function fetchCsrf() {
      try {
        const res = await fetch("/auth/csrf");
        const data = await res.json();
        csrfToken = data.csrfToken;
      } catch {}
    }
    fetchCsrf();

    const form = document.getElementById("register-form");
    const submitBtn = document.getElementById("submit-btn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.style.display = "none";
      const displayName = document.getElementById("displayName").value.trim();
      const email = document.getElementById("email").value.trim();
      const password = passwordInput.value;
      const confirmPassword = document.getElementById("confirmPassword").value;

      if (!displayName || !email || !password) {
        return showAlert("Please fill in all required fields.");
      }
      if (password.length < 8) {
        return showAlert("Password must be at least 8 characters long.");
      }
      if (password !== confirmPassword) {
        return showAlert("Passwords do not match.");
      }

      submitBtn.disabled = true;
      submitBtn.querySelector(".btn-text").textContent = "Creating account...";

      try {
        if (!csrfToken) await fetchCsrf();
        const res = await fetch("/auth/register", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": csrfToken || "",
          },
          body: JSON.stringify({ displayName, email, password }),
        });
        const data = await res.json();

        if (res.ok) {
          showAlert("Account created successfully! Redirecting...", "success");
          setTimeout(() => { window.location.href = "/settings.html"; }, 800);
        } else {
          showAlert(data.message || "Failed to create account.");
          submitBtn.disabled = false;
          submitBtn.querySelector(".btn-text").textContent = "Create account";
        }
      } catch (err) {
        showAlert("Network error. Please try again.");
        submitBtn.disabled = false;
        submitBtn.querySelector(".btn-text").textContent = "Create account";
      }
    });
  </script>
</body>
</html>
