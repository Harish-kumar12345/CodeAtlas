<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Server Error — LeetMatric</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/footer.css" />
  <style>
    .error-card {
      max-width: 520px;
      margin: 6rem auto;
      padding: 3rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-md);
      text-align: center;
      animation: fadeDown 0.4s ease both;
    }
    .error-code { font-family: var(--font-display); font-size: 3.5rem; font-weight: 800; color: var(--danger); line-height: 1; margin-bottom: 0.5rem; }
    .error-title { font-family: var(--font-display); font-size: 1.5rem; font-weight: 700; margin-bottom: 0.6rem; color: var(--text); }
    .error-msg { color: var(--text2); font-size: 0.95rem; line-height: 1.6; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <div class="bg-blobs" aria-hidden="true">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
  </div>

  <div class="page-wrapper">
    <main>
      <div class="error-card">
        <div class="error-code">500</div>
        <h1 class="error-title">Unexpected Error</h1>
        <p class="error-msg">
          Something went wrong while processing your request. Our automated monitors have been alerted. Please try again in a few moments.
        </p>
        <button onclick="window.location.reload()" class="dashboard-action primary" style="cursor:pointer; padding:0.6rem 1.4rem; font-size:0.9rem;">
          Retry Request
        </button>
      </div>
    </main>
  </div>

  <script src="/footer-config.js" defer></script>
  <script src="/footer.js" defer></script>
</body>
</html>
