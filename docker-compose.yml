services:
  app:
    build:
      context: .
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      FRONTEND_ORIGIN: http://localhost:3000
      DATABASE_URL: postgresql://leetmatric:leetmatric@postgres:5432/leetmatric
      DATABASE_SSL: "false"
      SESSION_SECRET: ${SESSION_SECRET:-local-development-only-change-me}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: leetmatric
      POSTGRES_USER: leetmatric
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-only}
    volumes:
      - leetmatric-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U leetmatric -d leetmatric"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  leetmatric-postgres:
